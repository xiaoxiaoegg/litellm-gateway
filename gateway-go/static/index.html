        // ====== 14. Playground 操练场 (真实可用, 直连 /v1/chat/completions) ======
        pgReset() { this.pgMessages = []; },
        async pgSend() {
          const text = (this.pgInput || '').trim();
          if (!text || !this.pgModel || !this.pgKey || this.pgStreaming) return;
          const msgs = [];
          if (this.pgSystem) msgs.push({ role: 'system', content: this.pgSystem });
          this.pgMessages.forEach(m => msgs.push({ role: m.role, content: m.content }));
          msgs.push({ role: 'user', content: text });
          this.pgMessages.push({ role: 'user', content: text });
          this.pgMessages.push({ role: 'assistant', content: '' });
          this.pgInput = '';
          this.pgStreaming = true;
          const idx = this.pgMessages.length - 1;
          try {
            const res = await fetch('/v1/chat/completions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.pgKey },
              body: JSON.stringify({ model: this.pgModel, messages: msgs, temperature: this.pgTemp, max_tokens: this.pgMaxTokens, stream: true }),
            });
            if (!res.ok) { const err = await res.text(); this.pgMessages[idx].content = '错误：' + err.slice(0, 300); this.toast('error', '请求失败'); return; }
            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let buf = '';
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buf += dec.decode(value, { stream: true });
              const lines = buf.split('\n');
              buf = lines.pop();
              for (const line of lines) {
                const t = line.trim();
                if (!t.startsWith('data:')) continue;
                const data = t.slice(5).trim();
                if (data === '[DONE]') continue;
                try {
                  const j = JSON.parse(data);
                  const delta = j.choices && j.choices[0] && j.choices[0].delta ? (j.choices[0].delta.content || '') : '';
                  if (delta) {
                    this.pgMessages[idx].content += delta;
                    this.$nextTick(() => { const el = document.getElementById('pg-scroll'); if (el) el.scrollTop = el.scrollHeight; });
                  }
                } catch (e) {}
              }
            }
          } catch (e) { this.pgMessages[idx].content = '请求异常：' + e.message; this.toast('error', '网络错误'); }
          finally { this.pgStreaming = false; }
        },

        // ====== 15. 个人设置 ======
        async savePassword() {
          if (!this.setForm.old_password || !this.setForm.new_password) { this.toast('error', '请填写完整'); return; }
          const r = await this.apiStub('POST', '/api/auth/change-password', { old_password: this.setForm.old_password, new_password: this.setForm.new_password }, '密码已更新');
          if (r) this.setForm = { old_password: '', new_password: '', email: this.setForm.email };
        },
        async saveEmail() {
          if (!this.setForm.email) { this.toast('error', '请填写邮箱'); return; }
          await this.apiStub('POST', '/api/auth/bind-email', { email: this.setForm.email }, '邮箱已保存');
        },
        async toggle2FA() {
          this.twoFAEnabled = !this.twoFAEnabled;
          await this.apiStub('POST', '/api/auth/2fa', { enabled: this.twoFAEnabled }, this.twoFAEnabled ? '2FA 已开启' : '2FA 已关闭');
        },
        async addPasskey() { await this.apiStub('POST', '/api/auth/passkey', {}, 'Passkey 已添加（后端待实现）'); },

        // ====== 16. 调用日志 + 操作审计 ======
        async loadCallLogs() { const r = await this.apiStub('GET', '/api/admin/logs'); this.callLogs = (r && r.logs) || []; },
        async loadAuditLogs() { const r = await this.apiStub('GET', '/api/admin/audit'); this.auditLogs = (r && r.logs) || []; },

        // ====== 17. 护栏监控 ======
        async loadGuardrails() { const r = await this.apiStub('GET', '/api/admin/guardrails'); this.guardrails = (r && r.guardrails) || []; },
        async toggleGuardrail(id) { await this.apiStub('POST', '/api/admin/guardrails/' + id + '/toggle', {}, '已更新'); this.loadGuardrails(); },

        // ====== 18. 订阅计划 ======
        async loadPlans() { const r = await this.apiStub('GET', '/api/admin/plans'); this.plans = (r && r.plans) || []; },
        async createPlan() {
          if (!this.planForm.name) { this.toast('error', '请填写套餐名'); return; }
          const r = await this.apiStub('POST', '/api/admin/plans', this.planForm, '套餐已创建');
          if (r) { this.planForm = { name: '', price: 0, quota: 0, duration_days: 30, description: '' }; this.loadPlans(); }
        },
        async deletePlan(id) { await this.apiStub('DELETE', '/api/admin/plans/' + id); this.loadPlans(); },

        // ====== 19. 智能体 / MCP / 技能 / 工具 ======
        async loadAgents() {
          this.agents = (await this.apiStub('GET', '/api/superadmin/agents') || {}).agents || [];
          this.mcpServers = (await this.apiStub('GET', '/api/superadmin/mcp') || {}).servers || [];
          this.skills = (await this.apiStub('GET', '/api/superadmin/skills') || {}).skills || [];
          this.tools = (await this.apiStub('GET', '/api/superadmin/tools') || {}).tools || [];
        },

        // ====== 20. 护栏与策略 ======
        async savePolicy() { await this.apiStub('POST', '/api/superadmin/policies', this.policyForm, '策略已保存'); },
        async loadPolicyRules() { const r = await this.apiStub('GET', '/api/superadmin/policy-rules'); this.policyRules = (r && r.rules) || []; },

        // ====== 21. 组织与 RBAC ======
        async loadOrg() {
          this.orgs = (await this.apiStub('GET', '/api/superadmin/orgs') || {}).orgs || [];
          this.accessGroups = (await this.apiStub('GET', '/api/superadmin/access-groups') || {}).groups || [];
          this.rbacRoles = (await this.apiStub('GET', '/api/superadmin/rbac-roles') || {}).roles || [];
        },

        // ====== 22. SSO / OAuth ======
        async saveSSO() {
          const providers = this.ssoProviders.map(p => ({ id: p.id, enabled: p.enabled, client_id: p.client_id, client_secret: p.client_secret, issuer: p.issuer }));
          await this.apiStub('POST', '/api/superadmin/sso', { providers, mfa_policy: this.mfaPolicy }, 'SSO 配置已保存');
        },

        // ====== 23. 系统设置 ======
        async saveSysSettings() { await this.apiStub('POST', '/api/superadmin/settings', this.sysSettings, '系统设置已保存'); },

        // ====== 24. 实验功能 ======
        async saveLabFlags() {
          const flags = this.labFlags.map(f => ({ id: f.id, enabled: f.enabled }));
          await this.apiStub('POST', '/api/superadmin/lab-flags', { flags }, '实验功能已保存');
        },
      };
    }
  </script>
  <script>
    // 安全网：若 2.5s 后 Alpine 仍未初始化（body 仍带 x-cloak），说明本地 JS 没加载成功，
    // 绝大多数情况是浏览器缓存了旧版页面（旧版从外部 CDN 加载 Alpine，被网络拦截）。
    // 不再静默白屏，直接提示用户强制刷新。
    setTimeout(function () {
      if (document.body && document.body.hasAttribute('x-cloak')) {
        document.body.removeAttribute('x-cloak');
        var b = document.createElement('div');
        b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:#fff;padding:12px 16px;font:14px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;text-align:center';
        b.textContent = '⚠️ 页面脚本未加载（多为浏览器缓存了旧版）。请按 Cmd+Shift+R 强制刷新，或开无痕窗口访问。';
        document.body.appendChild(b);
      }
    }, 2500);
  </script>
</body>
</html>
