        // Alpine 组件挂载时自动调用，加载所有数据
        init() { if (!this.token) return; this.loadData(); },

        // ====== 7. 数据加载 ======
        // 并行请求所有 API，填充页面数据
        // 请求路径映射:
        //   /api/auth/me      → userBalance
        //   /api/keys         → userKeys
        //   /api/transactions → transactions (取最近 50 条)
        //   /api/usage        → usageRecords (取最近 50 条)
        //   /api/admin/users        → allUsers (仅 admin)
        //   /api/admin/upstream-keys → upstreamKeys (仅 admin)
        //   /api/admin/pricing      → pricingList (仅 admin)
        async loadData() {
          this.loading = true;
          const headers = { 'Authorization': 'Bearer ' + this.token };
          try {
            const me = await (await fetch('/api/auth/me', { headers })).json();
            this.userBalance = me.balance;

            const kr = await (await fetch('/api/keys', { headers })).json();
            this.userKeys = kr.keys || [];

            const tr = await (await fetch('/api/transactions', { headers })).json();
            this.transactions = (tr.transactions || []).slice(0, 50);

            const ur = await (await fetch('/api/usage', { headers })).json();
            this.usageRecords = (ur.usage || []).slice(0, 50);

            // 今日消耗 = 今天所有 deduct 类型交易的金额绝对值之和
            const today = new Date().toISOString().slice(0, 10);
            this.todayCost = this.transactions
              .filter(t => t.type === 'deduct' && t.created_at && t.created_at.startsWith(today))
              .reduce((s, t) => s + Math.abs(t.amount), 0);

            // 管理员额外加载用户/上游Key/定价数据
            if (this.role === 'admin') {
              const us = await (await fetch('/api/admin/users', { headers })).json();
              this.allUsers = us.users || [];
              const uk = await (await fetch('/api/admin/upstream-keys', { headers })).json();
              this.upstreamKeys = uk.keys || [];
              const pr = await (await fetch('/api/admin/pricing', { headers })).json();
              this.pricingList = pr.pricing || [];
              // 按天聚合(时间范围筛选)：拉取 rangeDays 窗口的数据给折线图
              const ds = await (await fetch('/api/admin/stats/daily?days=' + this.rangeDays, { headers })).json();
              this.dailyStats = ds.data || [];
            }
          } catch (e) { console.error(e); }
          finally { this.loading = false; }
        },

        // 刷新概览数据 (切换回仪表盘时调用)
        async refreshStats() { this.loadData(); },

        // 切换看板时间范围(7/14/30 天)：仅 admin，重新拉取按天数据并重绘图表
        async setRange(d) {
          this.rangeDays = d;
          if (this.role === 'admin') {
            const headers = { 'Authorization': 'Bearer ' + this.token };
            try {
              const ds = await (await fetch('/api/admin/stats/daily?days=' + d, { headers })).json();
              this.dailyStats = ds.data || [];
              this.$nextTick(() => this.renderCharts());
            } catch (e) { console.error(e); }
          }
        },

        // 使用指南的代码示例生成（用于一键复制）
        curlSample() {
          return `curl ${window.location.origin}/v1/chat/completions \\
  -H "Content-Type: application/json" \\
  -H "Authorization: Bearer YOUR_API_KEY" \\
  -d '{
    "model": "deepseek-chat",
    "messages": [{"role": "user", "content": "你好"}]
  }'`;
        },
        pySample() {
          return `from openai import OpenAI

client = OpenAI(
    api_key="YOUR_API_KEY",
    base_url="${window.location.origin}/v1"
)

response = client.chat.completions.create(
    model="deepseek-chat",
    messages=[{"role": "user", "content": "你好"}]
)
print(response.choices[0].message.content)`;
        },
        nodeSample() {
          return `import OpenAI from 'openai';

const client = new OpenAI({
  apiKey: 'YOUR_API_KEY',
  baseURL: '${window.location.origin}/v1',
});

const response = await client.chat.completions.create({
  model: 'deepseek-chat',
  messages: [{ role: 'user', content: '你好' }],
});
console.log(response.choices[0].message.content);`;
        },

                // 剪贴板复制 (用于复制 API Key)
        copyText(text) { navigator.clipboard.writeText(text); this.toast('success', '已复制到剪贴板'); },

        // ====== 8. CRUD: API Keys ======
        // 创建 Key: POST /api/keys { key_name }
        async createKey() {
          if (!this.newKeyName) return;
          const res = await fetch('/api/keys', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
            body: JSON.stringify({ key_name: this.newKeyName })
          });
          const data = await res.json();
          if (res.ok) { this.newKeyResult = data.api_key; this.newKeyName = ''; this.loadData(); }
          else { this.toast('error', data.detail || '创建失败'); }
        },

        // 切换 Key 启用/禁用状态: PATCH /api/keys/:id/toggle
        async toggleKey(id) {
          await fetch('/api/keys/' + id + '/toggle', { method: 'PATCH', headers: { 'Authorization': 'Bearer ' + this.token } });
          this.loadData();
        },

        // 删除 Key: DELETE /api/keys/:id (有确认弹窗)
        async deleteKey(id) {
          if (!confirm('确定删除此 Key？')) return;
          await fetch('/api/keys/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + this.token } });
          this.loadData();
        },

        // ====== 9. CRUD: 用户管理 (Admin Only) ======
        // 创建用户: POST /api/admin/users { username, password, balance }
        async createUser() {
          const res = await fetch('/api/admin/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
            body: JSON.stringify(this.adminForm)
          });
          if (res.ok) { this.adminForm = { username: '', password: '', balance: 0 }; this.loadData(); this.toast('success', '用户创建成功'); }
          else { const d = await res.json(); this.toast('error', d.detail || '创建失败'); }
        },

        // 充值: POST /api/admin/users/:id/recharge { amount } (弹窗输入金额)
        async rechargeUser(id) {
          const amount = prompt('充值积分：');
          if (!amount || isNaN(amount)) return;
          await fetch('/api/admin/users/' + id + '/recharge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
            body: JSON.stringify({ amount: parseFloat(amount) })
          });
          this.loadData();
          this.toast('success', '充值成功');
        },

        // 扣减: POST /api/admin/users/:id/deduct { amount } (弹窗输入金额)
        async deductUser(id) {
          const amount = prompt('扣减积分：');
          if (!amount || isNaN(amount)) return;
          await fetch('/api/admin/users/' + id + '/deduct', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
            body: JSON.stringify({ amount: parseFloat(amount) })
          });
          this.loadData();
          this.toast('success', '扣减成功');
        },

        // ====== 10. CRUD: 上游 Key (Admin Only) ======
        // 添加上游 Key: POST /api/admin/upstream-keys { model_name, api_key, account_name, priority }
        async addUpstreamKey() {
          const res = await fetch('/api/admin/upstream-keys', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
            body: JSON.stringify(this.upstreamForm)
          });
          if (res.ok) { this.upstreamForm = { model_name: '', api_key: '', account_name: '', priority: 0 }; this.loadData(); this.toast('success', '上游 Key 已添加'); }
          else { const d = await res.json(); this.toast('error', d.detail || '添加失败'); }
        },

        // 删除上游 Key: DELETE /api/admin/upstream-keys/:id
        async deleteUpstreamKey(id) {
          if (!confirm('确定删除？')) return;
          await fetch('/api/admin/upstream-keys/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + this.token } });
          this.loadData();
          this.toast('success', '已删除');
        },

        // ====== 11. CRUD: 模型定价 (Admin Only) ======
        // 设置定价: POST /api/admin/pricing { model_name, prompt_price_per_1k, completion_price_per_1k }
        async setPricing() {
          await fetch('/api/admin/pricing', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.token },
            body: JSON.stringify({
              model_name: this.pricingForm.model_name,
              prompt_price_per_1k: parseFloat(this.pricingForm.prompt),
              completion_price_per_1k: parseFloat(this.pricingForm.completion)
            })
          });
          this.pricingForm = { model_name: '', prompt: 0, completion: 0 };
          this.loadData();
          this.toast('success', '定价已保存');
        },

        // ====== 12. 退出登录 ======
        // 清除 localStorage 中的 token 和 role，跳转到首页 (触发未登录状态)
        logout() {
          localStorage.removeItem('token');
          localStorage.removeItem('role');
          window.location.href = '/';
        },

        // 切换明暗主题并持久化 (body[data-theme] 由 :data-theme="theme" 绑定)
        toggleTheme() {
          this.theme = this.theme === 'dark' ? 'light' : 'dark';
          localStorage.setItem('theme', this.theme);
        },
      };
    }
  </script>
</body>
