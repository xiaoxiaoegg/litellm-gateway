upstream litellm_backend {
    server litellm:4000;
}

upstream app_backend {
    server gateway-go:8000;
}

server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }

    location /health {
        proxy_pass http://app_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    # ⚠️ 关键：所有 /v1/* API 流量必须走网关 gateway-go（app_backend），
    # 由网关做 API Key 鉴权 + 按用户计费 + 模型名映射，再内部用 master key 转发 litellm。
    # 之前这里指向 litellm_backend 会绕过网关：① 无鉴权无计费 ② litellm 拒绝网关的 Key 导致 401。
    location /v1/ {
        proxy_pass http://app_backend/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /chat/completions {
        proxy_pass http://litellm_backend/chat/completions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    location /models {
        proxy_pass http://litellm_backend/models;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://app_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app/ {
        proxy_pass http://app_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 管理/用户 REST API（登录、建用户、Key 管理、余额、用量、后台数据）—— 必须走网关
    # 没有这一段，别人用域名时连 /api/auth/login、/api/keys 都到不了网关，后台与建 Key 全部 404。
    location /api/ {
        proxy_pass http://app_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ⚠️ /metrics 仍指向 litellm_backend（Prometheus/Grafana 监控面板依赖 litellm 指标，勿改）
    location /metrics {
        proxy_pass http://litellm_backend/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 管理页 Web UI（index.html / login.html / 静态资源 /vendor/ 等）—— 必须走网关，否则 https://8443/ 404 打不开后台
    location / {
        proxy_pass http://app_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}